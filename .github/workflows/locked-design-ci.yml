name: Locked Design CI

on:
  push:
    branches:
      - work/locked-pdf-rebuild
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Diff check
        run: git diff --check 9efeeb66323259fa1fbd3f82950476c8d8cacdc5..HEAD
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
